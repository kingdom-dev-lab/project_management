version: '3.9'
services:
  app:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: file:./backend/prisma/dev.db
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - .:/app
      - sqlite_data:/app/backend/prisma
    command: sh -c "npm install && npx prisma generate --schema backend/prisma/schema.prisma && npx prisma db push --schema backend/prisma/schema.prisma && npm run dev"

volumes:
  sqlite_data:
